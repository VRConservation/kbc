site_name: HELP Knowledge-Base Charter
site_url: https://vrconservation.github.io/kbc/
repo_url: https://github.com/VRConservation/kbc
repo_name: VRConservation/kbc
edit_uri: edit/main/notes/

docs_dir: notes
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks.py

plugins:
  - search
  - roamlinks

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home:
    - index.md
    - Baseline: Baseline.md
    - Charter: Charter.md
    - Data: Data.md
    - WOB: WOB.md
    - Misc: Misc.md
    - Log: log.md
    - Catalog: Catalog.md
